# Safe startup config for TClient
# Copy this to your DDNet config folder as settings_ddnet.cfg

# Graphics - Safe defaults
gfx_screen 0
gfx_screen_width 1280
gfx_screen_height 720
gfx_fullscreen 0
gfx_borderless 0
gfx_vsync 1
gfx_refresh_rate 0
gfx_backend "OpenGL"
gfx_gl_major 3
gfx_gl_minor 3
gfx_gl_patch 0
gfx_fsaa_samples 0

# Window position - centered
gfx_window_x -1
gfx_window_y -1

# Disable problematic features
gfx_asyncrender_old 0
